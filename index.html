<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости уборки | ВАЛЛИ</title>
    <style>
        :root {
            --primary: #c25e38;
            --primary-dark: #a34c2c;
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --text-main: #2c221e;
            --text-muted: #786c67;
            --border-color: #e6ded6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(44, 34, 30, 0.06);
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .calc-group {
            margin-bottom: 20px;
        }

        /* Range slider styling */
        .range-container {
            background: #f7f3ee;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .range-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Checkboxes / Extras */
        .extras-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .extra-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f7f3ee;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .extra-card:hover {
            border-color: var(--primary);
        }

        .extra-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .extra-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .extra-title {
            font-size: 14px;
            font-weight: 500;
        }

        .extra-price {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Total Section */
        .total-box {
            background: #2c221e;
            color: #ffffff;
            padding: 20px;
            border-radius: 14px;
            margin-top: 24px;
            text-align: center;
        }

        .total-label {
            font-size: 13px;
            color: #b5a8a2;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .total-price {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <div class="logo">ВАЛЛИ</div>
                <div class="brand-subtitle">Калькулятор уборки</div>
            </div>
            <!-- Ссылка на ТГ убрана -->
        </header>

        <!-- Площадь -->
        <div class="calc-group">
            <div class="range-container">
                <div class="range-header">
                    <span class="section-title" style="margin:0;">Площадь помещения</span>
                    <span class="range-value" id="areaValue">45 м²</span>
                </div>
                <input type="range" id="areaRange" min="20" max="250" step="5" value="45">
            </div>
        </div>

        <!-- Дополнительные услуги -->
        <div class="calc-group">
            <div class="section-title">Дополнительные опции</div>
            <div class="extras-grid" id="extrasContainer">
                <label class="extra-card">
                    <div class="extra-info">
                        <input type="checkbox" class="extra-checkbox" data-price="500">
                        <span class="extra-title">Мытье духовки</span>
                    </div>
                    <span class="extra-price">500 ₽</span>
                </label>
                <label class="extra-card">
                    <div class="extra-info">
                        <input type="checkbox" class="extra-checkbox" data-price="400">
                        <span class="extra-title">Холодильник (внутри)</span>
                    </div>
                    <span class="extra-price">400 ₽</span>
                </label>
                <label class="extra-card">
                    <div class="extra-info">
                        <input type="checkbox" class="extra-checkbox" data-price="350">
                        <span class="extra-title">Окно (1 створка)</span>
                    </div>
                    <span class="extra-price">350 ₽</span>
                </label>
            </div>
        </div>

        <!-- Итог -->
        <div class="total-box">
            <div class="total-label">Итоговая стоимость</div>
            <div class="total-price" id="totalPrice">0 ₽</div>
            <button class="btn" id="orderBtn">Заказать расчет</button>
        </div>
    </div>

    <script>
        const baseRatePerSqm = 60; // Базовая цена за м2
        const areaRange = document.getElementById('areaRange');
        const areaValue = document.getElementById('areaValue');
        const totalPriceEl = document.getElementById('totalPrice');
        const checkboxes = document.querySelectorAll('.extra-checkbox');
        const orderBtn = document.getElementById('orderBtn');

        function calculateTotal() {
            const area = parseInt(areaRange.value);
            areaValue.textContent = area + ' м²';

            let total = area * baseRatePerSqm;

            checkboxes.forEach(cb => {
                if (cb.checked) {
                    total += parseInt(cb.dataset.price);
                }
            });

            totalPriceEl.textContent = total.toLocaleString('ru-RU') + ' ₽';
            return total;
        }

        areaRange.addEventListener('input', calculateTotal);
        checkboxes.forEach(cb => cb.addEventListener('change', calculateTotal));

        // Кнопка заказа не ведет на канал, просто выводит уведомление или копирует
        orderBtn.addEventListener('click', () => {
            const total = calculateTotal();
            const area = areaRange.value;
            alert(`Расчет сформирован! Площадь: ${area} м², Сумма: ${total.toLocaleString('ru-RU')} ₽.\n\n(Кнопка готова к подключению мессенджера)`);
        });

        // Первичный расчет
        calculateTotal();
    </script>
</body>
</html>
